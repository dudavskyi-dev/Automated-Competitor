[project]
name = "competitive-intelligence-pipeline"
version = "0.1.0"
description = "Competitive Intelligence Pipeline"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "langgraph>=0.2"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app/domain", "app/ports"]
