[project]
name = "competitive-intelligence-pipeline"
version = "0.1.0"
description = "Competitive Intelligence Pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "langgraph>=0.2",
    "ollama>=0.3",
    "openai>=2.0",
    "crawl4ai>=0.4",
    "ddgs>=9.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tenacity>=9.0",
    "structlog>=24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app/domain", "app/ports"]

[[tool.mypy.overrides]]
module = "crawl4ai.*"
ignore_missing_imports = true
